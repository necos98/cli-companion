[package]
name = "cli-companion"
version = "0.7.1"
description = "CLI companion con terminali integrati Windows + WSL"
authors = ["you"]
edition = "2021"

[lib]
name = "cli_companion_lib"
# Solo rlib: staticlib/cdylib servono ai target mobile (non usati) e
# allungano la build (con LTO il cdylib viene linkato a parte).
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-notification = "2"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = "0.8"
windows-sys = { version = "0.59", features = ["Win32_System_Power"] }

[profile.release]
# LTO "thin" e codegen-units di default (16): build molto piu' veloce
# a fronte di un binario leggermente piu' grande.
lto = "thin"
opt-level = 3
panic = "abort"
strip = true
