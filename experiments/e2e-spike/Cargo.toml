[package]
name = "e2e-spike"
version = "0.1.0"
edition = "2021"
publish = false
description = "Esperimento: LFM3-1.7B + llama-server + agent-browser per test E2E in linguaggio naturale"

# Crate indipendente: non appartiene a nessun workspace del repository.
[workspace]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.6", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "3.5", features = ["json"] }
zip = { version = "4.6", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_ProcessStatus", "Win32_System_Threading"] }
