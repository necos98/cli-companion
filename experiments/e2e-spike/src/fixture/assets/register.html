<h1>Create your account</h1>
<form id="register-form" novalidate>
  <label for="name">Full name</label>
  <input id="name" name="name" type="text" autocomplete="off">
  <p id="name-error" role="alert" hidden></p>

  <label for="email">Email</label>
  <input id="email" name="email" type="text" inputmode="email" autocomplete="off">
  <p id="email-error" role="alert" hidden></p>

  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="off">
  <p id="password-error" role="alert" hidden></p>

  <label for="confirm-password">Confirm password</label>
  <input id="confirm-password" name="confirm" type="password" autocomplete="off">
  <p id="confirm-error" role="alert" hidden></p>

  <label class="inline" for="terms">
    <input id="terms" name="terms" type="checkbox"> I accept the terms and conditions
  </label>
  <p id="terms-error" role="alert" hidden></p>

  <p id="form-error" role="alert" hidden></p>
  <button type="submit">Create account</button>
</form>
